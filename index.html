<style>
  @font-face { font-family:"Anton"; src:url("/fonts/Anton-Regular.ttf") format("truetype"); font-display:swap; }
  :root {
    --coat:#F7F7FB; --paper:#FFFFFF; --shadow:#D9D8EC; --ink:#0E3B34; --patina:#2E8B78;
    --mint:#E4F1ED; --neon:#C8FF3C; --muted:#5B6B67;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --display: "Anton", Impact, "Arial Narrow", sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { cursor:default; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  img, svg, a { -webkit-user-drag:none; user-drag:none; }
  a, a * { cursor:pointer; }
  h1, p, span, footer { cursor:default; }
  html { background:var(--coat); }
  body { color:var(--ink); font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; min-height:100vh; overflow-x:hidden; }
  body::before { content:""; position:fixed; inset:0; z-index:-1;
    background:
      repeating-linear-gradient(0deg, transparent 0 27px, #ECECF6 27px 28px),
      repeating-linear-gradient(90deg, transparent 0 27px, #ECECF6 27px 28px), var(--coat); }
  .wrap { max-width:480px; margin:0 auto; padding:calc(min(36vw, 168px) * 1.284 + 40px) 20px 40px; }
  .mono { font-family:var(--mono); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
  html { overflow-anchor:none; }

  /* hero: sticker + title. On phones it is a sticky header that shrinks as you scroll (--p: 0 → 1) */
  .hero { --p:0; position:fixed; top:0; left:0; right:0; z-index:4; display:flex; align-items:center; max-width:480px; margin:0 auto;
    gap:calc(16px - 6px * var(--p)); padding:calc(22px - 14px * var(--p)) 20px calc(16px - 8px * var(--p)); }
  .hero::before { content:""; position:absolute; inset:0 calc(50% - 50vw); z-index:-1; opacity:min(1, calc(var(--p) * 4));
    background:rgba(247,247,251,.92); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border-bottom:2px solid var(--ink); }
  .hero-art { flex:none; }
  .sticker { position:relative; overflow:hidden; width:calc(min(36vw, 168px) - (min(36vw, 168px) - 58px) * var(--p)); height:calc(min(36vw, 168px) * 1.284 * (1 - var(--p)) + 60px * var(--p)); transform:rotate(-4deg); animation:slap .7s cubic-bezier(.2,1.4,.4,1) both; }
  .sticker img { display:block; width:100%; height:auto; }
  .sticker .full { opacity:calc(1.6 - var(--p) * 2.4); }
  .sticker .head { position:absolute; inset:0; opacity:calc(var(--p) * 2.4 - .6); }
  .sticker img.bump { animation:wobble .55s ease; }
  @keyframes slap { from { opacity:0; transform:rotate(-14deg) scale(1.35); } to { opacity:1; transform:rotate(-4deg) scale(1); } }
  @keyframes wobble { 0%,100% { transform:rotate(0); } 25% { transform:rotate(4deg); } 60% { transform:rotate(-3deg); } }
  .hero-text { min-width:0; }


  /* title */
  h1 { font-family:var(--display); font-weight:400; text-transform:uppercase; line-height:.9; }
  h1 .its { display:block; overflow:hidden; color:var(--patina); letter-spacing:.04em;
    font-size:calc(min(1.8rem, (100vw - 54px - min(36vw, 168px)) / 7.5) * (1 - var(--p))); opacity:calc(1 - var(--p) * 1.284); margin-bottom:calc(.16em * (1 - var(--p))); }
  h1 .name { display:inline-block; position:relative; z-index:0; white-space:nowrap; padding:0 .06em;
    font-size:calc(min(3.8rem, (100vw - 54px - min(36vw, 168px)) / 4.35) * (1 - .5 * var(--p))); }
  h1 .name::before { content:""; position:absolute; z-index:-1; left:-.04em; right:-.06em; top:.24em; bottom:.04em;
    background:var(--neon); transform:rotate(-1.4deg) skewX(-6deg); border-radius:.05em; }
  .label { display:block; line-height:1.5; color:var(--patina); white-space:nowrap;
    font-size:calc(.66rem - .12rem * var(--p)); margin-top:calc(12px - 7px * var(--p)); }
  .label .l1, .label .l2 { display:block; }
  .flag { display:inline-block; width:15px; height:9px; margin:0 .45em 0 .05em; vertical-align:middle; position:relative; top:-1px; }
  .flag svg { display:block; width:100%; height:100%; }
  .label b { font-family:var(--display); font-weight:400; font-size:1.6em; letter-spacing:0; color:var(--ink); margin-right:.4em; vertical-align:-.12em; }
  .label .sep { display:none; }

  /* links */
  .primary { display:flex; flex-direction:column; gap:12px; }
  .secondary { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .card { display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--ink);
    background:linear-gradient(var(--neon), var(--neon)) no-repeat left / 0% 100%, var(--paper);
    border:2px solid var(--ink); border-radius:16px; box-shadow:0 3px 0 var(--ink);
    transition:background-size .28s ease, transform .12s ease, box-shadow .12s ease; }
  .card:hover, .card:focus-visible { background-size:100% 100%, auto; transform:translateY(-2px); box-shadow:0 5px 0 var(--ink); outline:none; }
  .card:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
  .ico { flex:none; display:grid; place-items:center; background:var(--mint); border-radius:12px; transition:background .2s ease; }
  .ico svg { fill:var(--patina); transition:fill .2s ease; }
  .card:hover .ico, .card:focus-visible .ico { background:var(--ink); }
  .card:hover .ico svg, .card:focus-visible .ico svg { fill:var(--neon); }
  .big { padding:12px 18px 12px 12px; }
  .big .ico { width:52px; height:52px; } .big .ico svg { width:26px; height:26px; }
  .big .txt { display:flex; flex-direction:column; flex:1; }
  .big .name { font-weight:800; font-size:1.15rem; }

  .big .go { font-size:1.3rem; color:var(--muted); }
  .small { padding:9px 12px 9px 9px; border-radius:14px; }
  .small .ico { width:36px; height:36px; border-radius:10px; } .small .ico svg { width:18px; height:18px; }
  .small .name { font-weight:800; font-size:.98rem; }

  /* prescription slip */
  .slip { position:relative; margin-top:30px; background:var(--paper); border:2px solid var(--ink); border-radius:6px;
    padding:20px 22px 18px; box-shadow:0 3px 0 var(--ink); }
  .slip::before, .slip::after { content:""; position:absolute; left:10px; right:10px; height:8px;

  .slip::before { top:-5px; } .slip::after { bottom:-5px; }

  .slip a:hover { background-size:100% 100%; }
  footer { margin-top:34px; text-align:center; color:var(--muted); }

  /* roaming camera sticker */
  .roamer { position:fixed; left:0; top:0; width:62px; z-index:5; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }

  .bubble { position:fixed; left:0; top:0; z-index:6; pointer-events:none; font-family:var(--display); font-size:1.05rem; letter-spacing:.02em;

    .hero { display:contents; }

    .label .l1, .label .l2 { display:inline; } .label .sep { display:inline; }
    .flag { width:20px; height:12px; }
    .sticker .full { opacity:1; } .sticker .head { display:none; }

    .big { position:relative; flex-direction:column; align-items:flex-start; gap:18px; padding:18px; }
    .big .go { position:absolute; right:18px; top:18px; }
    .big .name { font-size:1.3rem; }

    footer { text-align:left; margin-top:26px; }
    .roamer { width:110px; }
    .bubble { font-size:1.45rem; padding:6px 14px 7px; border-width:2.5px; border-radius:14px; box-shadow:0 4px 0 var(--ink); letter-spacing:.03em; }

  @media (prefers-reduced-motion: reduce) {
